name: Offline compatibility
on:
  push:
    branches: [main, 'fix/windows-*']
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline fixtures and native launcher smoke tests
        run: python -m unittest discover -s tests -v
